<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>截图</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      overflow: hidden;
      cursor: crosshair;
    }
    
    #screenshot-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 9999;
    }
    
    #screenshot-area {
      position: absolute;
      border: 2px solid #3b82f6;
      background-color: rgba(255, 255, 255, 0.1);
      cursor: move;
    }
    
    #screenshot-controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      padding: 10px;
      background-color: rgba(0, 0, 0, 0.8);
      border-radius: 8px;
      z-index: 10000;
    }
    
    .control-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .control-btn.primary {
      background-color: #3b82f6;
      color: white;
    }
    
    .control-btn.primary:hover {
      background-color: #2563eb;
    }
    
    .control-btn.secondary {
      background-color: rgba(255, 255, 255, 0.2);
      color: white;
    }
    
    .control-btn.secondary:hover {
      background-color: rgba(255, 255, 255, 0.3);
    }
    
    .control-btn.danger {
      background-color: rgba(239, 68, 68, 0.8);
      color: white;
    }
    
    .control-btn.danger:hover {
      background-color: rgba(220, 38, 38, 0.8);
    }
  </style>
</head>
<body>
  <div id="screenshot-overlay"></div>
  <div id="screenshot-area"></div>
  <div id="screenshot-controls">
    <button class="control-btn primary" id="confirm-btn">确认</button>
    <button class="control-btn secondary" id="cancel-btn">取消</button>
    <button class="control-btn danger" id="exit-btn">退出截图</button>
  </div>

  <script>
    const { ipcRenderer, screen } = require('electron');
    const fs = require('fs');
    const path = require('path');
    
    let isSelecting = false;
    let startX = 0;
    let startY = 0;
    let screenshotArea = null;
    let overlay = null;
    
    function init() {
      screenshotArea = document.getElementById('screenshot-area');
      overlay = document.getElementById('screenshot-overlay');
      
      // 绑定事件
      overlay.addEventListener('mousedown', startSelection);
      overlay.addEventListener('mousemove', updateSelection);
      overlay.addEventListener('mouseup', endSelection);
      
      // 绑定控制按钮事件
      document.getElementById('confirm-btn').addEventListener('click', confirmScreenshot);
      document.getElementById('cancel-btn').addEventListener('click', cancelScreenshot);
      document.getElementById('exit-btn').addEventListener('click', exitScreenshot);
      
      // 绑定键盘事件
      document.addEventListener('keydown', handleKeyboard);
    }
    
    function startSelection(e) {
      isSelecting = true;
      startX = e.clientX;
      startY = e.clientY;
      
      // 重置选择区域
      screenshotArea.style.left = `${startX}px`;
      screenshotArea.style.top = `${startY}px`;
      screenshotArea.style.width = '0px';
      screenshotArea.style.height = '0px';
      screenshotArea.style.display = 'block';
    }
    
    function updateSelection(e) {
      if (!isSelecting) return;
      
      const currentX = e.clientX;
      const currentY = e.clientY;
      
      // 计算选择区域的位置和大小
      const left = Math.min(startX, currentX);
      const top = Math.min(startY, currentY);
      const width = Math.abs(currentX - startX);
      const height = Math.abs(currentY - startY);
      
      // 更新选择区域
      screenshotArea.style.left = `${left}px`;
      screenshotArea.style.top = `${top}px`;
      screenshotArea.style.width = `${width}px`;
      screenshotArea.style.height = `${height}px`;
    }
    
    function endSelection() {
      isSelecting = false;
    }
    
    async function confirmScreenshot() {
      const rect = screenshotArea.getBoundingClientRect();
      
      // 检查是否选择了区域
      if (rect.width < 10 || rect.height < 10) {
        alert('请先选择截图区域');
        return;
      }
      
      try {
        // 创建临时文件路径
        const tempDir = path.join(__dirname, '..', '..', 'appData', 'temp');
        if (!fs.existsSync(tempDir)) {
          fs.mkdirSync(tempDir, { recursive: true });
        }
        
        const timestamp = Date.now();
        const screenshotPath = path.join(tempDir, `screenshot_${timestamp}.png`);
        
        // 通知主进程执行截图操作
        const result = await ipcRenderer.invoke('capture-selected-area', {
          x: rect.left,
          y: rect.top,
          width: rect.width,
          height: rect.height
        });
        
        if (result.success) {
          // 保存截图到文件
          fs.writeFileSync(screenshotPath, Buffer.from(result.imageData, 'base64'));
          
          // 通知主进程截图完成
          ipcRenderer.send('screenshot-completed', screenshotPath);
        } else {
          throw new Error(result.message || '截图失败');
        }
      } catch (error) {
        console.error('Error taking screenshot:', error);
        alert('截图失败：' + error.message);
      }
    }
    
    function cancelScreenshot() {
      // 重置选择区域
      screenshotArea.style.display = 'none';
    }
    
    function exitScreenshot() {
      // 通知主进程截图取消
      ipcRenderer.send('screenshot-canceled');
    }
    
    function handleKeyboard(e) {
      switch (e.key) {
        case 'Enter':
          confirmScreenshot();
          break;
        case 'Escape':
          if (screenshotArea.style.display === 'block') {
            cancelScreenshot();
          } else {
            exitScreenshot();
          }
          break;
      }
    }
    
    // 初始化
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
